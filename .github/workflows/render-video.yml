name: Render Promo Video

on:
  repository_dispatch:
    types:
      - render_video

jobs:
  render:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      # ================================================================
      # CHECKOUT
      # ================================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ================================================================
      # NODE
      # ================================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: remotion/package-lock.json

      # ================================================================
      # SYSTEM DEPENDENCIES
      # ================================================================

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # ================================================================
      # REMOTION BROWSER CACHE
      # ================================================================

      - name: Cache Remotion browser
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/puppeteer
            ~/.cache/remotion
            ~/.cache/ms-playwright
            remotion/node_modules/.cache
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('remotion/package-lock.json') }}
          restore-keys: |
            remotion-browser-${{ runner.os }}-

      # ================================================================
      # INSTALL DEPENDENCIES
      # ================================================================

      - name: Install dependencies
        working-directory: remotion
        run: |
          npm ci

      # ================================================================
      # BROWSER SETUP
      # ================================================================

      - name: Ensure Chromium is available
        working-directory: remotion
        run: |
          npx remotion browser ensure

      # ================================================================
      # RENDER ENVIRONMENT
      # ================================================================

      - name: Check render environment
        working-directory: remotion
        run: |
          echo "========================================"
          echo "NODE"
          echo "========================================"
          node --version

          echo ""
          echo "========================================"
          echo "NPM"
          echo "========================================"
          npm --version

          echo ""
          echo "========================================"
          echo "REMOTION"
          echo "========================================"
          npx remotion versions

          echo ""
          echo "========================================"
          echo "FFMPEG"
          echo "========================================"
          ffmpeg -version | head -n 1

          echo ""
          echo "========================================"
          echo "MEMORY"
          echo "========================================"
          free -h

          echo ""
          echo "========================================"
          echo "CPU"
          echo "========================================"
          nproc

          echo ""
          echo "========================================"
          echo "DISK"
          echo "========================================"
          df -h

      # ================================================================
      # WRITE CONFIG
      # ================================================================

      - name: Write render config
        env:
          RENDER_CONFIG: ${{ toJSON(github.event.client_payload.config) }}
        run: |
          set -euo pipefail

          printf '%s' "$RENDER_CONFIG" > /tmp/config.json

          echo "Config written."

      # ================================================================
      # VALIDATE CONFIG
      # ================================================================

      - name: Validate render config
        run: |
          set -euo pipefail

          echo "Render configuration:"
          cat /tmp/config.json

          echo ""
          echo "Validating JSON..."

          jq empty /tmp/config.json

          echo "JSON is valid."

      # ================================================================
      # PREPARE OUTPUT DIRECTORY
      # ================================================================

      - name: Prepare output directory
        working-directory: remotion
        env:
          OUTPUT_PATH: ${{ github.event.client_payload.config.outputPath }}
        run: |
          set -euo pipefail

          if [ -z "${OUTPUT_PATH:-}" ]; then
            echo "ERROR: outputPath is empty."
            exit 1
          fi

          mkdir -p "$(dirname "${OUTPUT_PATH}")"

          echo "Output path:"
          echo "${OUTPUT_PATH}"

      # ================================================================
      # RENDER
      # ================================================================

      - name: Render video
        working-directory: remotion
        run: |
          set -euo pipefail

          node render.mjs \
            --config /tmp/config.json \
            --verbose

      # ================================================================
      # VERIFY OUTPUT
      # ================================================================

      - name: Verify rendered video
        working-directory: remotion
        env:
          OUTPUT_PATH: ${{ github.event.client_payload.config.outputPath }}
        run: |
          set -euo pipefail

          echo "Expected output:"
          echo "${OUTPUT_PATH}"

          if [ ! -f "${OUTPUT_PATH}" ]; then
            echo ""
            echo "ERROR: Rendered video was not found."
            echo ""

            echo "Render directory:"
            find . -maxdepth 4 -type f | sort | head -200

            exit 1
          fi

          echo ""
          echo "Rendered video found:"
          ls -lh "${OUTPUT_PATH}"

          echo ""
          echo "Video information:"

          ffprobe \
            -v error \
            -show_entries \
            format=duration,size,format_name \
            -of default=noprint_wrappers=1 \
            "${OUTPUT_PATH}"

      # ================================================================
      # CLOUDINARY
      # ================================================================

      - name: Upload to Cloudinary
        id: upload

        env:
          CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UNSIGNED_PRESET }}
          JOB_ID: ${{ github.event.client_payload.job_id }}
          OUTPUT_PATH: ${{ github.event.client_payload.config.outputPath }}

        shell: bash

        run: |
          set -euo pipefail

          echo "Preparing Cloudinary upload..."

          if [ -z "${CLOUD_NAME:-}" ]; then
            echo "ERROR: CLOUDINARY_CLOUD_NAME secret is empty."
            exit 1
          fi

          if [ -z "${UPLOAD_PRESET:-}" ]; then
            echo "ERROR: CLOUDINARY_UNSIGNED_PRESET secret is empty."
            exit 1
          fi

          if [ -z "${JOB_ID:-}" ]; then
            echo "ERROR: job_id is empty."
            exit 1
          fi

          if [ ! -f "${OUTPUT_PATH}" ]; then
            echo "ERROR: Video file does not exist:"
            echo "${OUTPUT_PATH}"
            exit 1
          fi

          CLOUDINARY_URL="https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload"

          echo "Cloudinary cloud name: ${CLOUD_NAME}"
          echo "Output file: ${OUTPUT_PATH}"

          echo ""
          echo "File size:"
          ls -lh "${OUTPUT_PATH}"

          echo ""
          echo "Uploading video..."

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            --url "${CLOUDINARY_URL}" \
            --form "file=@${OUTPUT_PATH}" \
            --form "public_id=promo_videos/${JOB_ID}" \
            --form "upload_preset=${UPLOAD_PRESET}" \
            --output /tmp/cloudinary_response.json

          echo ""
          echo "Cloudinary response:"
          cat /tmp/cloudinary_response.json

          VIDEO_URL=$(
            jq -r '.secure_url // empty' \
              /tmp/cloudinary_response.json
          )

          if [ -z "${VIDEO_URL}" ]; then
            echo ""
            echo "ERROR: Cloudinary did not return secure_url."
            exit 1
          fi

          echo ""
          echo "Video uploaded successfully."

          echo "video_url=${VIDEO_URL}" >> "${GITHUB_OUTPUT}"

      # ================================================================
      # DJANGO SUCCESS CALLBACK
      # ================================================================

      - name: Notify Django - success
        if: success()

        env:
          JOB_ID: ${{ github.event.client_payload.job_id }}
          SECRET: ${{ secrets.RENDER_CALLBACK_SECRET }}
          VIDEO_URL: ${{ steps.upload.outputs.video_url }}
          CALLBACK_URL: ${{ secrets.DJANGO_CALLBACK_URL }}

        shell: bash

        run: |
          set -euo pipefail

          echo "Notifying Django of successful render..."

          if [ -z "${CALLBACK_URL:-}" ]; then
            echo "ERROR: DJANGO_CALLBACK_URL secret is empty."
            exit 1
          fi

          if [ -z "${VIDEO_URL:-}" ]; then
            echo "ERROR: VIDEO_URL is empty."
            exit 1
          fi

          PAYLOAD=$(
            jq -n \
              --arg job_id "${JOB_ID}" \
              --arg status "success" \
              --arg video_url "${VIDEO_URL}" \
              '{
                job_id: $job_id,
                status: $status,
                video_url: $video_url
              }'
          )

          curl \
            --fail-with-body \
            -sS \
            -X POST \
            "${CALLBACK_URL}" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${SECRET}" \
            -d "${PAYLOAD}"

          echo ""
          echo "Django success callback completed."

      # ================================================================
      # DJANGO FAILURE CALLBACK
      # ================================================================

      - name: Notify Django - failure
        if: failure()

        env:
          JOB_ID: ${{ github.event.client_payload.job_id }}
          SECRET: ${{ secrets.RENDER_CALLBACK_SECRET }}
          CALLBACK_URL: ${{ secrets.DJANGO_CALLBACK_URL }}

        shell: bash

        run: |
          set -euo pipefail

          echo "Notifying Django that video rendering failed..."

          if [ -z "${CALLBACK_URL:-}" ]; then
            echo "ERROR: DJANGO_CALLBACK_URL secret is empty."
            exit 1
          fi

          PAYLOAD=$(
            jq -n \
              --arg job_id "${JOB_ID}" \
              --arg status "failed" \
              '{
                job_id: $job_id,
                status: $status
              }'
          )

          curl \
            --fail-with-body \
            -sS \
            -X POST \
            "${CALLBACK_URL}" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${SECRET}" \
            -d "${PAYLOAD}"

          echo ""
          echo "Django failure callback completed."