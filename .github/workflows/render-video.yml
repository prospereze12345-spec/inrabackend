
name: Render Promo Video

on:
  repository_dispatch:
    types:
      - render_video

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ================================================================
      # CHECKOUT
      # ================================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ================================================================
      # NODE.JS
      # ================================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: remotion/package-lock.json


      # ================================================================
      # PYTHON
      # Required by Edge TTS
      # ================================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ================================================================
      # INSTALL EDGE TTS
      # ================================================================

      - name: Install Edge TTS
        run: |
          python -m pip install --upgrade pip
          python -m pip install edge-tts


      # ================================================================
      # VERIFY EDGE TTS
      # ================================================================

      - name: Verify Edge TTS
        run: |
          python --version
          python -m edge_tts --help


      # ================================================================
      # INSTALL REMOTION DEPENDENCIES
      # ================================================================

      - name: Install Remotion dependencies
        working-directory: remotion
        run: |
          npm ci


      # ================================================================
      # CACHE REMOTION / CHROMIUM
      # ================================================================

      - name: Cache Remotion browser
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/puppeteer
            ~/.cache/remotion
            remotion/node_modules/.cache
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('remotion/package-lock.json') }}
          restore-keys: |
            remotion-browser-${{ runner.os }}-


      # ================================================================
      # ENSURE REMOTION BROWSER
      # ================================================================

      - name: Ensure Remotion browser
        working-directory: remotion
        run: |
          npx remotion browser ensure


      # ================================================================
      # ENVIRONMENT CHECK
      # ================================================================

      - name: Check render environment
        working-directory: remotion
        run: |
          echo "========================================"
          echo "NODE"
          echo "========================================"
          node --version

          echo ""
          echo "========================================"
          echo "NPM"
          echo "========================================"
          npm --version

          echo ""
          echo "========================================"
          echo "PYTHON"
          echo "========================================"
          python --version

          echo ""
          echo "========================================"
          echo "EDGE TTS"
          echo "========================================"
          python -m edge_tts --help > /dev/null
          echo "Edge TTS is available."

          echo ""
          echo "========================================"
          echo "REMOTION"
          echo "========================================"
          npx remotion versions

          echo ""
          echo "========================================"
          echo "MEMORY"
          echo "========================================"
          free -h

          echo ""
          echo "========================================"
          echo "CPU"
          echo "========================================"
          nproc

          echo ""
          echo "========================================"
          echo "DISK"
          echo "========================================"
          df -h


      # ================================================================
      # WRITE RENDER CONFIG
      # ================================================================

      - name: Write render config
        env:
          RENDER_CONFIG: ${{ toJSON(github.event.client_payload.config) }}
        run: |
          printf '%s' "$RENDER_CONFIG" > /tmp/config.json


      # ================================================================
      # VALIDATE RENDER CONFIG
      # ================================================================

      - name: Validate render config
        run: |
          echo "========================================"
          echo "RENDER CONFIG"
          echo "========================================"

          cat /tmp/config.json

          echo ""
          echo "========================================"
          echo "JSON VALIDATION"
          echo "========================================"

          jq empty /tmp/config.json

          echo "JSON is valid."


      # ================================================================
      # SHOW IMPORTANT CONFIG
      # ================================================================

      - name: Inspect render configuration
        run: |
          echo "Job ID:"
          jq -r '.jobId // "missing"' /tmp/config.json

          echo ""
          echo "Composition:"
          jq -r '.compositionId // "missing"' /tmp/config.json

          echo ""
          echo "Resolution:"
          jq -r '"\(.width)x\(.height)"' /tmp/config.json

          echo ""
          echo "FPS:"
          jq -r '.fps' /tmp/config.json

          echo ""
          echo "Output:"
          jq -r '.outputPath' /tmp/config.json

          echo ""
          echo "Media origin:"
          jq -r '.mediaOrigin // "default"' /tmp/config.json

          echo ""
          echo "Features:"
          jq '.inputProps.features // []' /tmp/config.json

          echo ""
          echo "Why Choose Us:"
          jq '.inputProps.whyChooseUs // []' /tmp/config.json


      # ================================================================
      # RENDER VIDEO
      # ================================================================

      - name: Render video
        working-directory: remotion
        run: |
          node render.mjs \
            --config /tmp/config.json \
            --verbose


      # ================================================================
      # VERIFY VIDEO
      # ================================================================

      - name: Verify rendered video
        working-directory: remotion
        env:
          OUTPUT_PATH: ${{ github.event.client_payload.config.outputPath }}
        run: |
          echo "========================================"
          echo "VERIFYING VIDEO"
          echo "========================================"

          echo "Expected output:"
          echo "${OUTPUT_PATH}"

          if [ ! -f "${OUTPUT_PATH}" ]; then
            echo ""
            echo "ERROR: Rendered video was not found."
            echo ""
            echo "Output directory:"
            find out -maxdepth 2 -type f -print 2>/dev/null || true
            exit 1
          fi

          echo ""
          echo "Rendered video found:"
          ls -lh "${OUTPUT_PATH}"

          echo ""
          echo "Video information:"

          if command -v ffprobe >/dev/null 2>&1; then
            ffprobe \
              -v error \
              -show_entries \
              format=duration,size \
              -of default=noprint_wrappers=1 \
              "${OUTPUT_PATH}"
          fi


      # ================================================================
      # UPLOAD TO CLOUDINARY
      # ================================================================

      - name: Upload to Cloudinary
        id: upload
        env:
          CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UNSIGNED_PRESET }}
          JOB_ID: ${{ github.event.client_payload.job_id }}
          OUTPUT_PATH: ${{ github.event.client_payload.config.outputPath }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "CLOUDINARY UPLOAD"
          echo "========================================"

          if [ -z "${CLOUD_NAME:-}" ]; then
            echo "ERROR: CLOUDINARY_CLOUD_NAME secret is empty."
            exit 1
          fi

          if [ -z "${UPLOAD_PRESET:-}" ]; then
            echo "ERROR: CLOUDINARY_UNSIGNED_PRESET secret is empty."
            exit 1
          fi

          if [ -z "${JOB_ID:-}" ]; then
            echo "ERROR: job_id is empty."
            exit 1
          fi

          if [ ! -f "${OUTPUT_PATH}" ]; then
            echo "ERROR: Video file does not exist:"
            echo "${OUTPUT_PATH}"
            exit 1
          fi

          CLOUDINARY_URL="https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload"

          echo "Cloudinary cloud name: ${CLOUD_NAME}"
          echo "Output file: ${OUTPUT_PATH}"

          echo ""
          echo "File size:"
          ls -lh "${OUTPUT_PATH}"

          echo ""
          echo "Uploading video..."

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            --url "${CLOUDINARY_URL}" \
            --form "file=@${OUTPUT_PATH}" \
            --form "public_id=promo_videos/${JOB_ID}" \
            --form "upload_preset=${UPLOAD_PRESET}" \
            --output /tmp/cloudinary_response.json

          echo ""
          echo "Cloudinary response:"
          cat /tmp/cloudinary_response.json

          VIDEO_URL=$(
            jq -r '.secure_url // empty' \
            /tmp/cloudinary_response.json
          )

          if [ -z "${VIDEO_URL}" ]; then
            echo ""
            echo "ERROR: Cloudinary did not return secure_url."
            exit 1
          fi

          echo ""
          echo "Video uploaded successfully:"
          echo "${VIDEO_URL}"

          echo "video_url=${VIDEO_URL}" >> "${GITHUB_OUTPUT}"


      # ================================================================
      # DJANGO SUCCESS CALLBACK
      # ================================================================

      - name: Notify Django - success
        if: success()
        env:
          JOB_ID: ${{ github.event.client_payload.job_id }}
          SECRET: ${{ secrets.RENDER_CALLBACK_SECRET }}
          VIDEO_URL: ${{ steps.upload.outputs.video_url }}
          CALLBACK_URL: ${{ secrets.DJANGO_CALLBACK_URL }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "DJANGO SUCCESS CALLBACK"
          echo "========================================"

          if [ -z "${CALLBACK_URL:-}" ]; then
            echo "ERROR: DJANGO_CALLBACK_URL secret is empty."
            exit 1
          fi

          curl \
            --fail-with-body \
            -sS \
            -X POST \
            "${CALLBACK_URL}" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${SECRET}" \
            -d "$(jq -n \
              --arg job_id "${JOB_ID}" \
              --arg status "success" \
              --arg video_url "${VIDEO_URL}" \
              '{
                job_id: $job_id,
                status: $status,
                video_url: $video_url
              }'
            )"

          echo ""
          echo "Django callback completed successfully."


      # ================================================================
      # DJANGO FAILURE CALLBACK
      # ================================================================

      - name: Notify Django - failure
        if: failure()
        env:
          JOB_ID: ${{ github.event.client_payload.job_id }}
          SECRET: ${{ secrets.RENDER_CALLBACK_SECRET }}
          CALLBACK_URL: ${{ secrets.DJANGO_CALLBACK_URL }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "DJANGO FAILURE CALLBACK"
          echo "========================================"

          if [ -z "${CALLBACK_URL:-}" ]; then
            echo "ERROR: DJANGO_CALLBACK_URL secret is empty."
            exit 1
          fi

          curl \
            --fail-with-body \
            -sS \
            -X POST \
            "${CALLBACK_URL}" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${SECRET}" \
            -d "$(jq -n \
              --arg job_id "${JOB_ID}" \
              --arg status "failed" \
              '{
                job_id: $job_id,
                status: $status
              }'
            )"

          echo ""
          echo "Django failure callback completed."
