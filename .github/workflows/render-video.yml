- name: Upload to Cloudinary
        id: upload
        env:
          CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UNSIGNED_PRESET }}
          JOB_ID: ${{ github.event.client_payload.job_id }}
          OUTPUT_PATH: ${{ github.event.client_payload.config.outputPath }}
        shell: bash
        run: |
          set -euo pipefail

          # Strip stray whitespace/newlines some secret managers add on paste
          CLOUD_NAME="$(printf '%s' "${CLOUD_NAME:-}" | tr -d '[:space:]')"
          UPLOAD_PRESET="$(printf '%s' "${UPLOAD_PRESET:-}" | tr -d '[:space:]')"

          if [ -z "${CLOUD_NAME}" ]; then
            echo "ERROR: CLOUDINARY_CLOUD_NAME secret is empty."
            exit 1
          fi

          # Catch the exact mistake that caused today's failure: pasting the
          # full cloudinary:// connection string instead of just the cloud name.
          if [[ "${CLOUD_NAME}" == *"cloudinary://"* || "${CLOUD_NAME}" == *"://"* ]]; then
            echo "ERROR: CLOUDINARY_CLOUD_NAME looks like a full CLOUDINARY_URL"
            echo "connection string, not a bare cloud name. It should look like"
            echo "'dxyz123abc', not 'cloudinary://key:secret@dxyz123abc'."
            echo "Fix the secret in GitHub → Settings → Secrets → Actions."
            exit 1
          fi

          if [ -z "${UPLOAD_PRESET}" ]; then
            echo "ERROR: CLOUDINARY_UNSIGNED_PRESET secret is empty."
            exit 1
          fi

          if [ -z "${JOB_ID:-}" ]; then
            echo "ERROR: job_id is empty."
            exit 1
          fi

          if [ ! -f "${OUTPUT_PATH}" ]; then
            echo "ERROR: Video file does not exist: ${OUTPUT_PATH}"
            exit 1
          fi

          UPLOAD_URL="https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload"
          echo "Uploading to: ${UPLOAD_URL}"
          echo "File size:"
          ls -lh "${OUTPUT_PATH}"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "${UPLOAD_URL}" \
            --form "file=@${OUTPUT_PATH}" \
            --form "public_id=promo_videos/${JOB_ID}" \
            --form "upload_preset=${UPLOAD_PRESET}" \
            --output /tmp/cloudinary_response.json

          echo "Cloudinary response:"
          cat /tmp/cloudinary_response.json

          VIDEO_URL=$(jq -r '.secure_url // empty' /tmp/cloudinary_response.json)

          if [ -z "${VIDEO_URL}" ]; then
            echo "ERROR: Cloudinary did not return secure_url. Full response above."
            exit 1
          fi

          echo "Video uploaded successfully: ${VIDEO_URL}"
          echo "video_url=${VIDEO_URL}" >> "${GITHUB_OUTPUT}"